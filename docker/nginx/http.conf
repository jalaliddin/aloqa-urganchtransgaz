# http-level definitions (loaded from conf.d before the server blocks)

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# Scheme as seen by the client: honour X-Forwarded-Proto from a TLS-terminating proxy
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $forwarded_proto $forwarded_https {
    https   on;
    default "";
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

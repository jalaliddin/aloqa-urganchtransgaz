# Production: React build served as static files, /api and /sanctum go to Laravel.
server {
    listen 80;
    server_name _;

    # Never serve dotfiles (dev.conf omits this: Vite serves /node_modules/.vite/*)
    location ~ /\.(?!well-known) {
        deny all;
    }

    include /etc/nginx/snippets/common.conf;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed Vite assets are immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routes fall back to index.html (never cached so deployments take effect)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

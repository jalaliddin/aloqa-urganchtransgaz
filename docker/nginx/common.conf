# Shared server-level settings (included by default.conf and dev.conf)

client_max_body_size 60M;
server_tokens off;

# Client IP when running behind an upstream reverse proxy (e.g. TLS terminator)
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript application/geo+json text/xml application/xml image/svg+xml;

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Login endpoint: additional brute-force protection on top of Laravel's limiter
location = /api/auth/login {
    limit_req zone=login burst=10 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/laravel-fastcgi.conf;
}

location ~ ^/(api|sanctum)/ {
    limit_req zone=api burst=60 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/laravel-fastcgi.conf;
}
